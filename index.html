<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ec; --bg-solid:#eef0ec; --surface-op:#ffffff;
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.66);
  --text:#1b1d24; --text2:#5f6472; --muted:#9297a2;
  --gold:#9c7a34; --gold-soft:rgba(180,145,70,.14); --gold-line:rgba(180,145,70,.4);
  --line:rgba(20,22,30,.08); --line2:rgba(20,22,30,.13);
  --shadow:0 10px 34px rgba(20,22,30,.12);
}
[data-theme="dark"]{
  --bg:#0d1017; --bg-solid:#0d1017; --surface-op:#161b24;
  --glass:rgba(30,37,50,.46); --glass-strong:rgba(24,30,42,.64);
  --text:#f0ecdf; --text2:#a9afbd; --muted:#6d7484;
  --gold:#d8b56a; --gold-soft:rgba(216,181,106,.15); --gold-line:rgba(216,181,106,.36);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.15);
  --shadow:0 14px 44px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);
  overflow:hidden;position:fixed;width:100%;-webkit-font-smoothing:antialiased;transition:background .5s ease,color .5s ease}
#tint{position:fixed;inset:0;z-index:0;transition:background 1s ease;
  background:radial-gradient(130% 80% at 50% -10%,var(--surface-op) 0%,var(--bg) 55%)}

#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg);animation:splashOut .7s ease 2s forwards}
#splash .mk{animation:mkZoom 2.1s cubic-bezier(.22,.68,.2,1) forwards}
#splash .halo{transform-origin:center;animation:halo 2s ease-in-out infinite}
#splash .ring{stroke-dasharray:126;stroke-dashoffset:126;animation:draw 1s ease .2s forwards}
#splash .word{margin-top:26px;letter-spacing:.4em;font-weight:300;font-size:19px;color:var(--text);
  opacity:0;animation:wIn .8s ease .7s forwards;padding-left:.4em}
@keyframes mkZoom{0%{transform:scale(.85);opacity:0}22%{opacity:1}72%{transform:scale(1)}100%{transform:scale(6);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes halo{0%,100%{opacity:.25}50%{opacity:.5}}
@keyframes wIn{to{opacity:1}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;opacity:0;animation:appIn .8s ease 2.15s forwards}
@keyframes appIn{to{opacity:1}}

header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand .w{letter-spacing:.32em;font-weight:400;font-size:14px;color:var(--text);padding-left:.32em}
.hctrl{display:flex;align-items:center;gap:9px}
.iconbtn{width:40px;height:34px;border-radius:20px;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);
  color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:17px;height:17px}
.lang{display:flex;gap:2px;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:3px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.lang button{background:transparent;color:var(--muted);border:0;padding:5px 12px;border-radius:20px;
  font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}
.lang button.on{background:var(--gold-soft);color:var(--gold)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 22px 130px;-webkit-overflow-scrolling:touch}
.screen{display:none;animation:fade .4s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h2.t{font-weight:500;font-size:26px;letter-spacing:-.01em;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}

.field{margin-bottom:14px}
.flabel{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 8px 4px}
.input{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  color:var(--text);font-family:inherit;font-size:16px;outline:none;
  backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
.input::placeholder{color:var(--muted)}
select.input{appearance:none;-webkit-appearance:none;cursor:pointer}
.err{color:#c0392b;font-size:12.5px;margin:6px 0 0 4px;display:none}
.err.on{display:block}
.typechips{display:flex;gap:8px}
.typechips .chip{flex:1;text-align:center}
.durrow{display:flex;gap:10px}
.durrow .input{flex:1}
.addbtns{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.bigbtn{width:100%;padding:15px;border-radius:26px;font-family:inherit;font-weight:500;font-size:15px;cursor:pointer;
  border:1px solid var(--gold);background:var(--gold);color:#fff}
.bigbtn.ghost{background:var(--glass);color:var(--text);border-color:var(--line2);backdrop-filter:blur(14px)}

.searchbar{display:flex;align-items:center;gap:11px;background:var(--glass);border:1px solid var(--line);
  border-radius:16px;padding:12px 15px;margin-bottom:16px;
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.searchbar input{flex:1;background:transparent;border:0;color:var(--text);font-family:inherit;font-size:15px;outline:none}
.searchbar input::placeholder{color:var(--muted)}

.chips{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;padding:8px 16px;border-radius:22px;border:1px solid var(--line2);background:transparent;
  color:var(--text2);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.chip.on{background:var(--gold-soft);border-color:var(--gold-line);color:var(--gold)}

.empty{text-align:center;color:var(--muted);padding:60px 24px;font-size:14px;line-height:1.7}

.row{display:flex;gap:14px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.acc{width:4px;height:42px;border-radius:4px;flex-shrink:0}
.row .info{flex:1;min-width:0}
.row .rn{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rm{color:var(--muted);font-size:12.5px;margin-top:3px}
.row .rr{font-weight:600;color:var(--gold);font-size:17px;flex-shrink:0}
.rank-n{width:20px;text-align:center;font-weight:500;color:var(--muted);font-size:14px;flex-shrink:0}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px 16px;margin:8px 4px 30px}
.stat .n{font-size:46px;font-weight:300;color:var(--text);letter-spacing:-.02em;line-height:1}
.stat .n.g{color:var(--gold)}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:7px}
.fineblock{border-top:1px solid var(--line);padding-top:6px}
.finerow{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.finerow .fk{color:var(--text2)}
.finerow .fv{font-weight:500}
.shareBtn{width:100%;margin-top:24px;padding:15px;border-radius:26px;border:1px solid var(--gold-line);
  background:var(--gold-soft);color:var(--gold);font-family:inherit;font-weight:500;font-size:15px;cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

#detail{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;overflow-y:auto}
#detail.on{display:flex;animation:sheetIn .45s cubic-bezier(.2,.7,.2,1)}
@keyframes sheetIn{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
#detBg{position:fixed;inset:0;z-index:-1;transition:background .6s ease;background:var(--bg-solid)}
.detTop{display:flex;justify-content:flex-end;padding:18px 20px 0}
.closeb{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);
  backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);color:var(--text);font-size:16px;cursor:pointer}
.detBody{padding:14px 26px 60px;max-width:520px;margin:0 auto;width:100%}
.detEmblem{width:52px;height:52px;border-radius:50%;margin:0 auto 18px}
.detTitle{font-size:27px;font-weight:500;text-align:center;line-height:1.18;letter-spacing:-.01em}
.detMeta{text-align:center;color:var(--text2);font-size:13.5px;margin-top:9px}
.card2{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.card2 .lab{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:500}
.ratewrap{display:flex;align-items:center;gap:16px}
.ratewrap input[type=range]{flex:1;accent-color:var(--gold);height:4px}
.ratenum{font-size:34px;font-weight:300;color:var(--gold);min-width:66px;text-align:right;letter-spacing:-.02em}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper .ct{display:flex;align-items:center;gap:18px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:20px;cursor:pointer}
.stepper .v{font-size:19px;font-weight:500;min-width:20px;text-align:center}
.actions{display:flex;gap:11px;margin-top:22px}
.actions button{flex:1;padding:15px;border-radius:26px;font-family:inherit;font-weight:500;font-size:15px;cursor:pointer;
  border:1px solid var(--line2);background:var(--glass);color:var(--text);backdrop-filter:blur(14px)}
.actions button.prim{background:var(--gold);color:#fff;border-color:var(--gold)}
.delBtn{display:block;margin:20px auto 0;background:none;border:0;color:#c0392b;font-family:inherit;font-size:13.5px;cursor:pointer}

#duel{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:26px;
  background:rgba(20,22,30,.4);backdrop-filter:blur(6px)}
#duel.on{display:flex;animation:fade .3s ease}
.duelbox{background:var(--glass-strong);border:1px solid var(--line);border-radius:24px;padding:26px;max-width:420px;width:100%;
  box-shadow:var(--shadow);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7)}
.duelbox h3{font-weight:500;font-size:19px;text-align:center;margin-bottom:5px}
.duelbox p{color:var(--muted);font-size:13px;text-align:center;margin-bottom:22px}
.duelpair{display:flex;gap:14px}
.duelopt{flex:1;cursor:pointer;text-align:center;padding:20px 12px;border:1px solid var(--line2);border-radius:16px;background:var(--glass)}
.duelopt .dd{width:34px;height:34px;border-radius:50%;margin:0 auto 12px}
.duelopt .dn{font-size:14px;font-weight:500;line-height:1.3}

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;
  display:flex;gap:4px;padding:7px;border-radius:30px;background:var(--glass-strong);
  backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);
  border:1px solid var(--line);box-shadow:var(--shadow)}
nav button{width:56px;height:46px;border:0;background:transparent;border-radius:23px;display:flex;
  align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:.25s}
nav button.on{background:var(--gold-soft);color:var(--gold)}
nav button svg{width:23px;height:23px}
</style>
</head>
<body>
<div id="tint"></div>

<div id="splash">
  <div class="mk">
    <svg width="76" height="76" viewBox="0 0 76 76">
      <circle class="halo" cx="38" cy="38" r="26" fill="#9c7a34" opacity="0.3"/>
      <circle class="ring" cx="38" cy="38" r="20" fill="none" stroke="#9c7a34" stroke-width="1.6"/>
      <circle cx="38" cy="38" r="6" fill="#9c7a34"/>
    </svg>
  </div>
  <div class="word">LUMEN</div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 76 76">
        <circle cx="38" cy="38" r="20" fill="none" stroke="var(--gold)" stroke-width="2.4"/>
        <circle cx="38" cy="38" r="6.5" fill="var(--gold)"/>
      </svg>
      <span class="w">LUMEN</span>
    </div>
    <div class="hctrl">
      <button id="themeBtn" class="iconbtn" aria-label="Thème jour/nuit"></button>
      <div class="lang">
        <button data-lang="fr" class="on">FR</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="screen on" id="s-add">
      <h2 class="t" data-i="addTitle"></h2>
      <div class="sub" data-i="addSub"></div>
      <div class="field">
        <input class="input" id="fTitle" data-ph="fTitlePh" autocomplete="off">
        <div class="err" id="fErr" data-i="fErr"></div>
      </div>
      <div class="field">
        <div class="flabel" data-i="fTypeL"></div>
        <div class="typechips" id="typeChips"></div>
      </div>
      <div class="field"><input class="input" id="fYear" type="number" data-ph="fYearPh" inputmode="numeric"></div>
      <div class="field"><div class="flabel" data-i="fDurL"></div><div id="durField"></div></div>
      <div class="field">
        <div class="flabel" data-i="fGenreL"></div>
        <select class="input" id="fGenre"></select>
      </div>
      <div class="addbtns">
        <button class="bigbtn" id="addWlBtn" data-i="addBtn"></button>
        <button class="bigbtn ghost" id="addSeenBtn" data-i="seenBtn"></button>
      </div>
    </section>

    <section class="screen" id="s-watchlist">
      <h2 class="t" data-i="wlTitle"></h2>
      <div class="sub" data-i="wlSub"></div>
      <div class="searchbar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/></svg><input id="wlQ" data-ph="filterPh" autocomplete="off"></div>
      <div class="chips" id="chips-wl"></div>
      <div id="wl-list"></div>
    </section>

    <section class="screen" id="s-watched">
      <h2 class="t" data-i="wTitle"></h2>
      <div class="sub" data-i="wSub"></div>
      <div class="searchbar"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/></svg><input id="wQ" data-ph="filterPh" autocomplete="off"></div>
      <div class="chips" id="chips-w"></div>
      <div id="w-list"></div>
    </section>

    <section class="screen" id="s-stats">
      <h2 class="t" data-i="stTitle"></h2>
      <div class="sub" data-i="stSub"></div>
      <div id="stats-body"></div>
    </section>
  </main>

  <nav>
    <button data-tab="add" class="on" aria-label="Ajouter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button data-tab="watchlist" aria-label="À voir">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 4h12a1 1 0 0 1 1 1v15l-7-4-7 4V5a1 1 0 0 1 1-1z" stroke-linejoin="round"/></svg>
    </button>
    <button data-tab="watched" aria-label="Vu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4C6 4 2 12 2 12s4 8 10 8 10-8 10-8-4-8-10-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button data-tab="stats" aria-label="Stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
    </button>
  </nav>
</div>

<div id="detail">
  <div id="detBg"></div>
  <div class="detTop"><button class="closeb" id="detClose">✕</button></div>
  <div class="detBody" id="detBody"></div>
</div>

<div id="duel">
  <div class="duelbox">
    <h3 data-i="duelTitle"></h3>
    <p data-i="duelSub"></p>
    <div class="duelpair" id="duelPair"></div>
  </div>
</div>

<script>
const I={
 fr:{addTitle:"Ajouter",addSub:"Ajoute un film, une série ou un anime",
  fTitlePh:"Titre…",fErr:"Donne au moins un titre.",fTypeL:"Type",
  fYearPh:"Année (optionnel)",fGenreL:"Genre (optionnel)",fGenreNone:"—",
  addBtn:"Ajouter à ma liste",seenBtn:"Je l'ai déjà vu",
  wlTitle:"À voir",wlSub:"Ta liste d'envies",wTitle:"Vu",wSub:"Classés par note",
  stTitle:"Statistiques",stSub:"Ton année en un coup d'œil",filterPh:"Filtrer…",
  all:"Tout",film:"Film",series:"Série",anime:"Anime",
  emptyWl:"Rien pour l'instant.\nAjoute un titre depuis l'onglet Ajouter.",
  emptyW:"Aucun titre vu.\nMarque un titre comme vu pour lancer ton classement.",
  yourRate:"Ta note",times:"Visionnages",progress:"Progression",
  markSeen:"Marquer vu",save:"Enregistrer",backWl:"Remettre à voir",delete:"Supprimer",
  duelTitle:"Lequel tu préfères ?",duelSub:"Même note — aide-moi à les départager",
  hours:"heures vues",titles:"titres vus",films:"films",episodes:"séries & animes",
  topGenre:"Genre favori",decade:"Décennie préférée",rewatch:"Le plus revu",avg:"Note moyenne",
  bilan:"Bilan 2026",share:"Créer ma carte à partager",min:"min",hLetter:"h",durMinPh:"Durée en minutes (optionnel)",durHrPh:"Durée totale en heures (optionnel)",fDurL:"Durée (optionnel)",fHrPh:"Heures",fMinPh:"Minutes",fTotHrPh:"Heures totales (optionnel)"},
 en:{addTitle:"Add",addSub:"Add a movie, series or anime",
  fTitlePh:"Title…",fErr:"Enter a title first.",fTypeL:"Type",
  fYearPh:"Year (optional)",fGenreL:"Genre (optional)",fGenreNone:"—",
  addBtn:"Add to my list",seenBtn:"I've already seen it",
  wlTitle:"Watchlist",wlSub:"Your want-to-watch list",wTitle:"Watched",wSub:"Ranked by rating",
  stTitle:"Statistics",stSub:"Your year at a glance",filterPh:"Filter…",
  all:"All",film:"Movie",series:"Series",anime:"Anime",
  emptyWl:"Nothing yet.\nAdd a title from the Add tab.",
  emptyW:"Nothing watched yet.\nMark a title as watched to start your ranking.",
  yourRate:"Your rating",times:"Times watched",progress:"Progress",
  markSeen:"Mark watched",save:"Save",backWl:"Back to watchlist",delete:"Delete",
  duelTitle:"Which do you prefer?",duelSub:"Same rating — help me break the tie",
  hours:"hours watched",titles:"titles watched",films:"movies",episodes:"series & anime",
  topGenre:"Top genre",decade:"Top decade",rewatch:"Most rewatched",avg:"Average rating",
  bilan:"2026 recap",share:"Create shareable card",min:"min",hLetter:"h",durMinPh:"Duration in minutes (optional)",durHrPh:"Total hours (optional)",fDurL:"Duration (optional)",fHrPh:"Hours",fMinPh:"Minutes",fTotHrPh:"Total hours (optional)"}
};
let lang="fr";const t=k=>I[lang][k];

const G={action:{fr:"Action",en:"Action"},scifi:{fr:"Science-fiction",en:"Sci-Fi"},
 drama:{fr:"Drame",en:"Drama"},romance:{fr:"Romance",en:"Romance"},
 comedy:{fr:"Comédie",en:"Comedy"},thriller:{fr:"Thriller",en:"Thriller"},
 horror:{fr:"Horreur",en:"Horror"},fantasy:{fr:"Fantastique",en:"Fantasy"},
 animation:{fr:"Animation",en:"Animation"},doc:{fr:"Documentaire",en:"Documentary"},
 other:{fr:"Autre",en:"Other"}};

let items={};let order=[];let uid=1;
let curFilter={wl:"all",w:"all"};let curType="film";let pendingDuel=null;let detailId=null;
const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);

function hueOf(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h;}
function grad(it){const h=hueOf(it.title);return `linear-gradient(150deg,hsl(${h} 44% 47%),hsl(${(h+38)%360} 42% 30%))`;}
function accent(it){return `hsl(${hueOf(it.title)} 46% 50%)`;}
function typeLabel(ty){return t(ty);}
function fmtHM(min){if(!min||min<=0)return "—";const h=Math.floor(min/60),m=Math.round(min%60);return h?(m?`${h}${t('hLetter')}${String(m).padStart(2,'0')}`:`${h}${t('hLetter')}`):`${m} ${t('min')}`;}
function fmtLen(it){if(!it.mins)return typeLabel(it.type);return fmtHM(it.mins);}
function metaLine(it){const p=[typeLabel(it.type)];if(it.year)p.push(it.year);
 if(it.mins)p.push(fmtHM(it.mins));
 if(it.genre)p.push(G[it.genre][lang]);return p.join(" · ");}

function applyI(){$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 $$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));document.documentElement.lang=lang;
 buildTypeChips();buildDurationField();buildGenre();}
function buildTypeChips(){const host=$("#typeChips");const tys=["film","series","anime"];
 host.innerHTML=tys.map(ty=>`<button class="chip ${curType===ty?'on':''}" data-ty="${ty}">${t(ty)}</button>`).join("");
 host.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{curType=c.dataset.ty;
  buildTypeChips();buildDurationField();});}
function buildDurationField(){const host=$("#durField");if(!host)return;
 if(curType==="film")host.innerHTML=`<div class="durrow"><input class="input" id="fHr" type="number" inputmode="numeric" placeholder="${t('fHrPh')}"><input class="input" id="fMin" type="number" inputmode="numeric" placeholder="${t('fMinPh')}"></div>`;
 else host.innerHTML=`<input class="input" id="fTotHr" type="number" inputmode="decimal" placeholder="${t('fTotHrPh')}">`;}
function buildGenre(){const sel=$("#fGenre");const cur=sel.value;
 sel.innerHTML=`<option value="">${t('fGenreNone')}</option>`+Object.keys(G).map(g=>`<option value="${g}">${G[g][lang]}</option>`).join("");
 if(cur)sel.value=cur;}

function chipRow(host,which){const cats=["all","film","series","anime"];
 host.innerHTML=cats.map(v=>`<button class="chip ${curFilter[which]===v?'on':''}" data-c="${v}">${t(v)}</button>`).join("");
 host.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{curFilter[which]=c.dataset.c;renderAll();});}
const matchCat=(it,f)=>f==="all"||it.type===f;

function rowHTML(it,rank){const w=it.status==="seen";
 return `<div class="row" data-open="${it.id}">${rank?`<div class="rank-n">${rank}</div>`:""}
  <div class="acc" style="background:${accent(it)}"></div>
  <div class="info"><div class="rn">${it.title}</div><div class="rm">${metaLine(it)}${w&&it.times>1?` · ×${it.times}`:""}</div></div>
  ${w?`<div class="rr">${it.rating.toFixed(1)}</div>`:""}</div>`;}

function renderWatchlist(){chipRow($("#chips-wl"),"wl");const q=$("#wlQ").value.trim().toLowerCase();
 let list=Object.values(items).filter(it=>it.status==="wl"&&matchCat(it,curFilter.wl));
 if(q)list=list.filter(it=>it.title.toLowerCase().includes(q));
 const host=$("#wl-list");
 host.innerHTML=list.length?list.map(it=>rowHTML(it)).join(""):`<div class="empty">${t('emptyWl').replace(/\n/g,'<br>')}</div>`;}

function renderWatched(){chipRow($("#chips-w"),"w");const q=$("#wQ").value.trim().toLowerCase();
 let ids=order.filter(id=>items[id]&&matchCat(items[id],curFilter.w));
 if(q)ids=ids.filter(id=>items[id].title.toLowerCase().includes(q));
 const host=$("#w-list");
 if(!ids.length){host.innerHTML=`<div class="empty">${t('emptyW').replace(/\n/g,'<br>')}</div>`;return;}
 host.innerHTML=ids.map((id,i)=>rowHTML(items[id],order.indexOf(id)+1)).join("");}

function watchedMinutes(){let m=0;order.forEach(id=>{const it=items[id];if(it&&it.mins)
  m+=it.mins*(it.type==="film"?1:(it.progress??1))*it.times;});return Math.round(m);}
function renderStats(){const seen=order.filter(id=>items[id]);const host=$("#stats-body");
 if(!seen.length){host.innerHTML=`<div class="empty">${t('emptyW').replace(/\n/g,'<br>')}</div>`;return;}
 const films=seen.filter(id=>items[id].type==="film").length;const shows=seen.length-films;
 const avg=seen.reduce((s,id)=>s+items[id].rating,0)/seen.length;
 const rew=seen.map(id=>({id,x:items[id].times})).sort((a,b)=>b.x-a.x)[0];
 const gc={};seen.forEach(id=>{const g=items[id].genre;if(g)gc[g]=(gc[g]||0)+1;});
 const topG=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0];
 const dc={};seen.forEach(id=>{const y=items[id].year;if(y){const d=Math.floor(y/10)*10;dc[d]=(dc[d]||0)+1;}});
 const topD=Object.entries(dc).sort((a,b)=>b[1]-a[1])[0];
 let fine="";
 if(topG)fine+=`<div class="finerow"><span class="fk">${t('topGenre')}</span><span class="fv">${G[topG[0]][lang]}</span></div>`;
 if(topD)fine+=`<div class="finerow"><span class="fk">${t('decade')}</span><span class="fv">${topD[0]}s</span></div>`;
 if(rew&&rew.x>1)fine+=`<div class="finerow"><span class="fk">${t('rewatch')}</span><span class="fv">${items[rew.id].title} ×${rew.x}</span></div>`;
 fine+=`<div class="finerow"><span class="fk">${t('avg')}</span><span class="fv" style="color:var(--gold)">${avg.toFixed(1)}</span></div>`;
 host.innerHTML=`<div class="statgrid">
   <div class="stat"><div class="n g">${seen.length}</div><div class="l">${t('titles')}</div></div>
   <div class="stat"><div class="n">${fmtHM(watchedMinutes())}</div><div class="l">${t('hours')}</div></div>
   <div class="stat"><div class="n">${films}</div><div class="l">${t('films')}</div></div>
   <div class="stat"><div class="n">${shows}</div><div class="l">${t('episodes')}</div></div></div>
  <div class="fineblock">${fine}</div>
  <button class="shareBtn">${t('share')}</button>`;
 host.querySelector(".shareBtn").onclick=shareCard;}

function addItem(markSeen){const title=$("#fTitle").value.trim();
 if(!title){$("#fErr").classList.add("on");return;}
 $("#fErr").classList.remove("on");
 const year=parseInt($("#fYear").value)||null;
 let mins=null;
 if(curType==="film"){const h=parseInt($("#fHr")?.value)||0,mn=parseInt($("#fMin")?.value)||0;mins=(h*60+mn)||null;}
 else{const th=parseFloat($("#fTotHr")?.value)||null;mins=th?Math.round(th*60):null;}
 const genre=$("#fGenre").value||null;
 const id=uid++;items[id]={id,title,type:curType,year,mins,genre,status:"wl",rating:null,times:1,progress:1};
 $("#fTitle").value="";$("#fYear").value="";$("#fGenre").value="";buildDurationField();
 if(markSeen){renderAll();openDetail(id);}else{renderAll();switchTab("watchlist");}}

function openDetail(id){detailId=id;const it=items[id];const h=hueOf(it.title);const seen=it.status==="seen";
 $("#detBg").style.background=`radial-gradient(120% 70% at 50% 3%,hsl(${h} 52% 50% / .3),transparent 55%),var(--bg-solid)`;
 $("#tint").style.background=`radial-gradient(120% 80% at 50% -10%,hsl(${h} 52% 50% / .16),var(--bg) 55%)`;
 const rating=it.rating??7.5,times=it.times,prog=it.progress??1;
 let html=`<div class="detEmblem" style="background:${grad(it)}"></div>
  <div class="detTitle">${it.title}</div><div class="detMeta">${metaLine(it)}</div>
  <div class="card2"><div class="lab">${t('yourRate')}</div>
   <div class="ratewrap"><input type="range" id="rInput" min="0" max="10" step="0.1" value="${rating}">
    <div class="ratenum" id="rNum">${(+rating).toFixed(1)}</div></div></div>`;
 if(it.type!=="film"){html+=`<div class="card2"><div class="lab">${t('progress')}</div>
   <div class="ratewrap"><input type="range" id="pInput" min="0" max="100" step="5" value="${Math.round(prog*100)}">
    <div class="ratenum" id="pNum" style="font-size:24px">${Math.round(prog*100)}%</div></div></div>`;}
 html+=`<div class="card2 stepper"><div class="lab" style="margin:0">${t('times')}</div>
   <div class="ct"><button id="tMinus">−</button><div class="v" id="tVal">${times}</div><button id="tPlus">+</button></div></div>
  <div class="actions">
   ${seen?`<button id="backBtn">${t('backWl')}</button>`:""}
   <button id="saveBtn" class="prim">${seen?t('save'):t('markSeen')}</button></div>
  <button class="delBtn" id="delBtn">${t('delete')}</button>`;
 $("#detBody").innerHTML=html;
 const rIn=$("#rInput");rIn.oninput=()=>$("#rNum").textContent=(+rIn.value).toFixed(1);
 const pIn=$("#pInput");if(pIn)pIn.oninput=()=>$("#pNum").textContent=pIn.value+"%";
 let tv=times;$("#tMinus").onclick=()=>{tv=Math.max(1,tv-1);$("#tVal").textContent=tv;};
 $("#tPlus").onclick=()=>{tv++;$("#tVal").textContent=tv;};
 $("#saveBtn").onclick=()=>saveWatched(id,+rIn.value,tv,pIn?(+pIn.value/100):1);
 if($("#backBtn"))$("#backBtn").onclick=()=>{it.status="wl";order=order.filter(x=>x!==id);closeDetail();renderAll();switchTab("watchlist");};
 $("#delBtn").onclick=()=>{delete items[id];order=order.filter(x=>x!==id);closeDetail();renderAll();};
 $("#detail").classList.add("on");}
function closeDetail(){$("#detail").classList.remove("on");$("#tint").style.background="";}

function saveWatched(id,rating,times,prog){const it=items[id];
 it.rating=rating;it.times=times;it.progress=prog;it.status="seen";
 order=order.filter(x=>x!==id);
 const tie=order.find(o=>Math.abs(items[o].rating-rating)<0.05);
 if(tie!==undefined){pendingDuel={newId:id,tieId:tie};showDuel();return;}
 insertByRating(id);finishSave();}
function insertByRating(id,aboveTie=null){const r=items[id].rating;let i=0;
 while(i<order.length){const or=items[order[i]].rating;
  if(or<r)break;if(Math.abs(or-r)<0.05&&aboveTie===order[i])break;i++;}
 order.splice(i,0,id);}
function showDuel(){const a=items[pendingDuel.newId],b=items[pendingDuel.tieId];
 $("#duelPair").innerHTML=[a,b].map(it=>`<div class="duelopt" data-win="${it.id}">
  <div class="dd" style="background:${grad(it)}"></div><div class="dn">${it.title}</div></div>`).join("");
 $("#duelPair").querySelectorAll(".duelopt").forEach(o=>o.onclick=()=>resolveDuel(+o.dataset.win));
 $("#duel").classList.add("on");}
function resolveDuel(winId){const {newId,tieId}=pendingDuel;
 if(winId===newId)insertByRating(newId,tieId);
 else{const idx=order.indexOf(tieId);order.splice(idx+1,0,newId);}
 $("#duel").classList.remove("on");pendingDuel=null;finishSave();}
function finishSave(){closeDetail();renderAll();switchTab("watched");}

function shareCard(){const top=order.slice(0,5);const hrs=fmtHM(watchedMinutes());const cnt=order.length;
 const w=document.createElement("div");
 w.style.cssText="position:fixed;inset:0;z-index:80;background:rgba(20,22,30,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:22px";
 w.innerHTML=`<div style="width:100%;max-width:360px;background:var(--surface-op);color:var(--text);border-radius:26px;padding:28px;box-shadow:var(--shadow)">
   <div style="display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 76 76"><circle cx="38" cy="38" r="20" fill="none" stroke="var(--gold)" stroke-width="2.6"/><circle cx="38" cy="38" r="6.5" fill="var(--gold)"/></svg>
    <span style="letter-spacing:.3em;color:var(--text);font-size:12px;padding-left:.3em">LUMEN</span></div>
   <div style="font-size:23px;font-weight:500;margin:14px 0 20px">${t('bilan')}</div>
   <div style="display:flex;gap:26px;margin-bottom:22px">
    <div><div style="font-size:38px;font-weight:300;color:var(--gold);line-height:1">${cnt}</div><div style="font-size:12px;color:var(--muted);margin-top:5px">${t('titles')}</div></div>
    <div><div style="font-size:38px;font-weight:300;color:var(--text);line-height:1">${hrs}</div><div style="font-size:12px;color:var(--muted);margin-top:5px">${t('hours')}</div></div></div>
   ${top.map((id,i)=>{const it=items[id];return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:11px">
    <span style="color:var(--muted);font-weight:500;width:14px;font-size:13px">${i+1}</span>
    <div style="width:5px;height:34px;border-radius:4px;background:${accent(it)}"></div>
    <span style="flex:1;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.title}</span>
    <span style="color:var(--gold);font-weight:600">${it.rating.toFixed(1)}</span></div>`;}).join("")}
   <div style="text-align:center;margin-top:18px;color:var(--muted);font-size:11px">${lang==='fr'?'Touche pour fermer':'Tap to close'}</div></div>`;
 w.onclick=()=>w.remove();document.body.appendChild(w);}

function switchTab(tab){$$("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
 $$(".screen").forEach(s=>s.classList.remove("on"));$("#s-"+tab).classList.add("on");renderAll();}
function renderAll(){applyI();renderWatchlist();renderWatched();renderStats();save();}

const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.4A7.6 7.6 0 1 1 9.6 4 6 6 0 0 0 20 14.4z" stroke-linejoin="round"/></svg>';
const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.4" y1="5.4" x2="7.1" y2="7.1"/><line x1="16.9" y1="16.9" x2="18.6" y2="18.6"/><line x1="18.6" y1="5.4" x2="16.9" y2="7.1"/><line x1="7.1" y1="16.9" x2="5.4" y2="18.6"/></svg>';
const themeBtn=$("#themeBtn");let darkMode=false;
function save(){try{localStorage.setItem('lumen',JSON.stringify({items,order,uid,lang,dark:darkMode}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('lumen'));if(d){items=d.items||{};order=(d.order||[]).filter(id=>items[id]);uid=d.uid||1;if(d.lang)lang=d.lang;darkMode=!!d.dark;}}catch(e){}}
function setTheme(d){document.documentElement.dataset.theme=d?'dark':'light';themeBtn.innerHTML=d?sun:moon;save();}
load();setTheme(darkMode);
$$(".lang button").forEach(x=>x.classList.toggle("on",x.dataset.lang===lang));
themeBtn.onclick=()=>{darkMode=!darkMode;setTheme(darkMode);};

$$("nav button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$$(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;
 $$(".lang button").forEach(x=>x.classList.toggle("on",x.dataset.lang===lang));renderAll();});
$("#addWlBtn").onclick=()=>addItem(false);
$("#addSeenBtn").onclick=()=>addItem(true);
$("#wlQ").oninput=renderWatchlist;$("#wQ").oninput=renderWatched;
$("#detClose").onclick=closeDetail;
document.body.addEventListener("click",e=>{const o=e.target.closest("[data-open]");if(o)openDetail(+o.dataset.open);});
renderAll();
</script>
</body>
</html>
